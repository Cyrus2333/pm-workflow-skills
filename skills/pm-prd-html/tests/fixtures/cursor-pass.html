<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>SVG layout passing fixture</title>
<button class="state-btn active" data-state="STORY-DEFAULT">默认态</button>
<button class="state-btn" data-state="STORY-LONG">长内容顺序布局态</button>
<div id="svg-host" data-initial-state="STORY-DEFAULT" data-rendered-state="STORY-DEFAULT" data-render-status="ready">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" data-layout-contract="annotated-v1" data-rendered-state="STORY-DEFAULT">
    <g data-layout-block="summary" data-layout-box="summary-card"><rect data-layout-boundary x="20" y="20" width="260" height="80" fill="#fff" stroke="#222"/><text x="32" y="52" font-size="16">摘要</text><text x="32" y="78" font-size="14">一行内容</text><g data-layout-role="badge" data-layout-allow="overlap overflow" aria-label="角标"><rect x="238" y="12" width="34" height="20" fill="#ddd"/><text x="244" y="27" font-size="10">新</text></g></g>
    <g data-layout-block="action" data-layout-box="action-card"><rect data-layout-boundary x="20" y="116" width="260" height="80" fill="#fff" stroke="#222"/><text x="32" y="148" font-size="16">下一模块</text></g>
  </svg>
</div>
<script>
const stateContent={
  'STORY-DEFAULT':['一行内容'],
  'STORY-LONG':['第一行内容','新增的第二行内容','新增的第三行内容']
};
function build(id){
  let cursor=20;
  const lines=stateContent[id];
  const summaryHeight=54+lines.length*26;
  const summaryY=cursor;
  cursor+=summaryHeight+16;
  const actionY=cursor;
  const body=lines.map((line,index)=>`<text x="32" y="${78+index*26}" font-size="14">${line}</text>`).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" data-layout-contract="annotated-v1" data-rendered-state="${id}">
    <g data-layout-block="summary" data-layout-box="summary-card"><rect data-layout-boundary x="20" y="${summaryY}" width="260" height="${summaryHeight}" fill="#fff" stroke="#222"/><text x="32" y="52" font-size="16">摘要</text>${body}<g data-layout-role="badge" data-layout-allow="overlap overflow" aria-label="角标"><rect x="238" y="12" width="34" height="20" fill="#ddd"/><text x="244" y="27" font-size="10">新</text></g></g>
    <g data-layout-block="action" data-layout-box="action-card"><rect data-layout-boundary x="20" y="${actionY}" width="260" height="80" fill="#fff" stroke="#222"/><text x="32" y="${actionY+32}" font-size="16">下一模块</text></g>
  </svg>`;
}
const controls=[...document.querySelectorAll('[data-state]')];
function render(id){const host=document.getElementById('svg-host');host.dataset.renderStatus='rendering';controls.forEach((control)=>control.classList.toggle('active',control.dataset.state===id));host.innerHTML=build(id);host.dataset.renderedState=id;host.dataset.renderStatus='ready';}
controls.forEach((control)=>control.addEventListener('click',()=>render(control.dataset.state)));
render('STORY-DEFAULT');
</script>
</html>
