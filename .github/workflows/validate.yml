name: Validate Skills

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run repository validation
        run: bash scripts/validate-skills.sh

      - name: Run documentation validation
        run: python3 scripts/validate-docs.py

      - name: Run static HTML prototype validation
        run: python3 scripts/validate-html-prototypes.py

      - name: Run TAPD contract tests
        run: python3 -m unittest tests/test_pm_tapd_deliver.py
